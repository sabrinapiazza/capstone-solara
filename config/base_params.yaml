base_node:
  ros__parameters:
    serial_port: /dev/ttyACM0     # or /dev/solara_pico with scripts/99-solara.rules
    wheel_radius: 0.05            # m       TODO: measure
    track_width: 0.30             # m       TODO: tune with the spin test
    ticks_per_rev: 1440.0         # encoder ticks per wheel revolution  TODO: from motor datasheet
    publish_tf: true              # set false only if an EKF publishes odom -> base_link
    cmd_timeout: 0.5              # s, wheels stop if no cmd_vel arrives
