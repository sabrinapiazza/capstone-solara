# SLAM Toolbox in localization mode: match scans against a saved map.
# map_file_name is filled in by the launch file from the map:=... argument.
slam_toolbox:
  ros__parameters:
    mode: localization
    map_file_name: SET_BY_LAUNCH
    map_start_at_dock: true       # assumes the robot starts where mapping started

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    resolution: 0.05
    max_laser_range: 12.0
    transform_publish_period: 0.02
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    use_scan_matching: true
